name: Gold Poll (every 15 min, laeuft in der Cloud - unabhaengig vom eigenen PC)

on:
  schedule:
    # GitHub-Cron ist "best effort" - kann bei hoher Auslastung ein paar
    # Minuten Verspaetung haben, das ist normal und fuer M15-Zonen egal.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # erlaubt manuelles "Run workflow" zum Testen

permissions:
  contents: write   # noetig, damit der Workflow gold-data.json committen darf

concurrency:
  group: gold-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preis abrufen und gold-data.json aktualisieren
        run: python scripts/poll_gold.py

      - name: Aenderungen committen und pushen
        run: |
          git config user.name "gold-poll-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold-data.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen - ueberspringe Commit."
          else
            git commit -m "Gold-Preis Update $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push abgelehnt (vermutlich zwischenzeitliche Aenderung) - hole aktuellen Stand und versuche erneut ($i/3)..."
              git pull --rebase origin main
              sleep 2
            done
          fi
