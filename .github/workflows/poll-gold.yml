name: Gold Poll (every 15 min, laeuft in der Cloud - unabhaengig vom eigenen PC)

on:
  schedule:
    # GitHub-Cron ist "best effort" - offizielle GitHub-Doku warnt explizit:
    # "High load times include the start of every hour" - volle Viertelstunden
    # (:00/:15/:30/:45) sind der meistgenutzte Zeitpunkt ueberhaupt, weil dort
    # weltweit die meisten anderen Cron-Jobs ebenfalls feuern wollen. Deshalb
    # bewusst auf eine "krumme" Minute verschoben (hier: 7 nach jedem Viertel) -
    # bleibt weiterhin alle 15 Minuten, kollidiert aber seltener mit der Last-
    # spitze. Das ist GitHubs eigene offizielle Empfehlung dagegen.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}  # erlaubt manuelles "Run workflow" zum Testen

permissions:
  contents: write   # noetig, damit der Workflow gold-data.json committen darf

concurrency:
  group: gold-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preis abrufen und gold-data.json aktualisieren
        run: python scripts/poll_gold.py

      - name: Aenderungen committen und pushen
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Gold-Preis Update"
          commit_user_name: gold-poll-bot
          commit_user_email: actions@users.noreply.github.com
          file_pattern: gold-data.json
          skip_dirty_check: false
